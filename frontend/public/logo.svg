<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.5">
    <line x1="0" y1="16" x2="64" y2="16"/>
    <line x1="0" y1="32" x2="64" y2="32"/>
    <line x1="0" y1="48" x2="64" y2="48"/>
    <line x1="16" y1="0" x2="16" y2="64"/>
    <line x1="32" y1="0" x2="32" y2="64"/>
    <line x1="48" y1="0" x2="48" y2="64"/>
  </g>

  <!-- Rising chart line: low-left → small dip → strong climb → peak in top-right -->
  <path
    d="M 9 46 L 18 38 L 26 42 L 36 26 L 46 18 L 55 11"
    stroke="url(#line)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Peak marker -->
  <circle cx="55" cy="11" r="3.2" fill="#34d399" stroke="#ffffff" stroke-width="1.2"/>

  <!-- "313" mark, bottom-left -->
  <text x="9" y="58" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="9" font-weight="800" fill="#ffffff" fill-opacity="0.85" letter-spacing="0.5">
    313
  </text>
</svg>
